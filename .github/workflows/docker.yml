name: Build Official NanoMDM to My GHCR

on:
  workflow_dispatch: # 提供網頁手動按鈕觸發
  schedule:
    - cron: '0 0 * * 0' # (可選) 每週日自動抓取官方最新版編譯

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 關鍵：直接指定拉取官方 micromdm 的原始碼
      - name: Checkout official repository
        uses: actions/checkout@v4
        with:
          repository: 'micromdm/nanomdm'
          ref: 'main' # 拉取官方 main 分支

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
